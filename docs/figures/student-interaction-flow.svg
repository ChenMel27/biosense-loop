<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="920" viewBox="0 0 1800 920">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#102A43" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2F6B9A"/>
    </marker>
    <style>
      .title { font: 700 44px Arial, sans-serif; fill: #102A43; }
      .sub { font: 400 23px Arial, sans-serif; fill: #52677A; }
      .step { font: 700 17px Arial, sans-serif; letter-spacing: 1.4px; fill: #2F6B9A; }
      .head { font: 700 27px Arial, sans-serif; fill: #102A43; }
      .body { font: 400 20px Arial, sans-serif; fill: #3E5366; }
      .small { font: 400 17px Arial, sans-serif; fill: #52677A; }
      .branchHead { font: 700 20px Arial, sans-serif; fill: #102A43; }
      .branchBody { font: 400 17px Arial, sans-serif; fill: #3E5366; }
      .badge { font: 700 16px Arial, sans-serif; fill: #FFFFFF; }
      .note { font: 700 18px Arial, sans-serif; fill: #2B7A78; }
    </style>
  </defs>

  <rect width="1800" height="920" fill="#F7F9FC"/>
  <text x="90" y="80" class="title">Student interaction flow</text>
  <text x="90" y="120" class="sub">A low-stakes, 12–15 minute explanation → probe → revision → transfer loop</text>

  <path d="M325 365 H380" stroke="#2F6B9A" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M665 365 H720" stroke="#2F6B9A" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M1000 365 H1055" stroke="#2F6B9A" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M1340 365 H1395" stroke="#2F6B9A" stroke-width="5" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="190" width="255" height="350" rx="24" fill="#FFFFFF" stroke="#D7E2EB" stroke-width="3"/>
    <rect x="70" y="190" width="255" height="62" rx="24" fill="#102A43"/>
    <rect x="70" y="228" width="255" height="24" fill="#102A43"/>
    <text x="95" y="228" class="badge">STEP 1</text>
    <text x="95" y="300" class="head">Join safely</text>
    <text x="95" y="340" class="body"><tspan x="95" dy="0">Enter class code</tspan><tspan x="95" dy="30">and pseudonymous</tspan><tspan x="95" dy="30">participant code.</tspan></text>
    <rect x="95" y="440" width="205" height="58" rx="12" fill="#EEF5FA"/>
    <text x="116" y="476" class="small">No grades or ranking</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="380" y="190" width="285" height="350" rx="24" fill="#FFFFFF" stroke="#D7E2EB" stroke-width="3"/>
    <rect x="380" y="190" width="285" height="62" rx="24" fill="#2F6B9A"/>
    <rect x="380" y="228" width="285" height="24" fill="#2F6B9A"/>
    <text x="405" y="228" class="badge">STEP 2</text>
    <text x="405" y="300" class="head">Explain</text>
    <text x="405" y="340" class="body"><tspan x="405" dy="0">Use a beetle evidence</tspan><tspan x="405" dy="30">card to explain genes,</tspan><tspan x="405" dy="30">chromosomes, and trait.</tspan></text>
    <rect x="405" y="440" width="235" height="58" rx="12" fill="#EEF5FA"/>
    <text x="426" y="476" class="small">Choose confidence</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="720" y="160" width="280" height="410" rx="24" fill="#FFFFFF" stroke="#C99700" stroke-width="4"/>
    <rect x="720" y="160" width="280" height="62" rx="24" fill="#C99700"/>
    <rect x="720" y="198" width="280" height="24" fill="#C99700"/>
    <text x="745" y="198" class="badge">STEP 3 · ONE PROMPT</text>
    <text x="745" y="267" class="head">Reconsider</text>
    <rect x="745" y="300" width="230" height="94" rx="14" fill="#FFF6D9"/>
    <text x="765" y="330" class="branchHead">Every student</text>
    <text x="765" y="358" class="branchBody"><tspan x="765">Prewritten probe selected</tspan><tspan x="765" dy="23">from the fixed prompt bank</tspan></text>
    <rect x="745" y="415" width="230" height="94" rx="14" fill="#EEF5FA"/>
    <text x="765" y="445" class="branchHead">Matching follow-up</text>
    <text x="765" y="473" class="branchBody"><tspan x="765">Targets a missing or</tspan><tspan x="765" dy="23">incompatible science idea</tspan></text>
    <text x="745" y="545" class="small">Initial response is already locked.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1055" y="190" width="285" height="350" rx="24" fill="#FFFFFF" stroke="#D7E2EB" stroke-width="3"/>
    <rect x="1055" y="190" width="285" height="62" rx="24" fill="#2B7A78"/>
    <rect x="1055" y="228" width="285" height="24" fill="#2B7A78"/>
    <text x="1080" y="228" class="badge">STEP 4</text>
    <text x="1080" y="300" class="head">Revise fully</text>
    <text x="1080" y="340" class="body"><tspan x="1080" dy="0">Rebuild the complete</tspan><tspan x="1080" dy="30">explanation—not just</tspan><tspan x="1080" dy="30">append an answer.</tspan></text>
    <rect x="1080" y="440" width="235" height="58" rx="12" fill="#E7F5F3"/>
    <text x="1101" y="476" class="small">Revision is locked</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1395" y="190" width="335" height="350" rx="24" fill="#FFFFFF" stroke="#D7E2EB" stroke-width="3"/>
    <rect x="1395" y="190" width="335" height="62" rx="24" fill="#102A43"/>
    <rect x="1395" y="228" width="335" height="24" fill="#102A43"/>
    <text x="1420" y="228" class="badge">STEPS 5–6</text>
    <text x="1420" y="300" class="head">Transfer &amp; reflect</text>
    <text x="1420" y="340" class="body"><tspan x="1420" dy="0">Explain an unseen plant</tspan><tspan x="1420" dy="30">trait from new evidence</tspan><tspan x="1420" dy="30">without earlier work, then</tspan><tspan x="1420" dy="30">complete a short survey.</tspan></text>
    <rect x="1420" y="470" width="285" height="42" rx="12" fill="#EEF5FA"/>
    <text x="1441" y="498" class="small">Neutral completion screen</text>
  </g>

  <rect x="205" y="655" width="1390" height="150" rx="26" fill="#E7F5F3" stroke="#A9D6D0" stroke-width="3"/>
  <text x="250" y="705" class="note">Research protections built into the flow</text>
  <text x="250" y="748" class="body"><tspan x="250">Same complete workflow for every student</tspan><tspan x="840">• No AI-generated scientific prose</tspan></text>
  <text x="250" y="785" class="body"><tspan x="250">One response-specific prompt only</tspan><tspan x="840">• Human raters score the primary outcome</tspan></text>
</svg>
